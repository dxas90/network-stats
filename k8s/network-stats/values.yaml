replicaCount: 1

image:
  repository: "registry.gitlab.com/dxas90/network-stats"
  pullPolicy: "Always"
  tag: "latest"

service:
  type: "ClusterIP"
  port: 5000
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"

namespace: "default"

httproute:
  enabled: false
  gatewayName: "external"
  gatewayNamespace: "kube-system"
  sectionName: "https"
  annotations:
    networking.x-k8s.io/route-shard: "example"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    external-dns.alpha.kubernetes.io/target: "enter.example.com"
  labels:
    x-use-cloudflare-solver: "true"
  hostnames:
    - "stats.dxas90.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - port: 5000

persistence:
  enabled: true
  capacity: "8Mi"
  mountPath: "/secrets"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    cpu: 25m
    memory: 263Mi
  requests:
    cpu: 25m
    memory: 263Mi

chart:
  label: "network-stats"

# Environment variables loaded into a Secret
env:
  variables:
    APP_ENV: "production"
    APP_SECRET: "changeme"
    TMPDIR: "/tmp"

# Environment variables loaded into a ConfigMap
extraEnv:
  APP_THREADS: "1"
  INTERVAL: "30"
  LOGLEVEL: "info"
  MAILER_URL: "smtp://mail-server:1025"
  MONGODB_URL: "mongodb://mongodb:27017"
  REDIS_DSN: "redis://redis:6379?timeout=0.5"

# Common secret and settings references
common:
  secrets:
    enabled: false
    name: "common-secrets"
  settings:
    enabled: false
    name: "common-settings"

serviceAccount:
  create: true
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::1234567890:role/k8s-network-stats
  name: ""

podSecurityContext:
  fsGroup: 65534

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 6
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

# Volume mounts for writable dirs (required for readOnlyRootFilesystem)
volumeMounts:
  - name: cache-volume
    mountPath: /cache
  - name: tmp
    mountPath: /tmp

volumes:
  - name: cache-volume
    emptyDir: {}
  - name: tmp
    emptyDir: {}
