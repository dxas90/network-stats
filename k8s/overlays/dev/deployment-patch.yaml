apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-stats
spec:
  template:
    spec:
      containers:
        - name: network-stats
          env:
            - name: ENVIRONMENT
              value: develop
          resources:
            limits:
              cpu: 20m
              memory: 70Mi
            requests:
              cpu: 20m
              memory: 70Mi
