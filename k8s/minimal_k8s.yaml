apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    challenge.app: ridewithvia
  name: ridewithvia
spec:
  ports:
    - name: "web"
      port: 80
      targetPort: web # line 49
  selector:
    challenge.app: ridewithvia
status:
  loadBalancer: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    challenge.app: ridewithvia
  name: ridewithvia
spec:
  replicas: 2
  selector:
    matchLabels:
      challenge.app: ridewithvia
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        challenge.app: ridewithvia
        team: DevOps
    spec:
      containers:
        - name: ridewithvia
          envFrom:
            - configMapRef:
                name: ridewithvia-config
          image: dxas90/network-stats:latest # original imagen just in case that someone needs it
          ports:
            - name: web
              containerPort: 5000 # line 12
              protocol: TCP
          resources:
            limits:
              cpu: 10m
              memory: 56Mi
            requests:
              cpu: 10m
              memory: 56Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      # https://kubernetes.io/docs/concepts/containers/images/#referring-to-an-imagepullsecrets-on-a-pod
      # imagePullSecrets:
      #   - name: pull-registry
      restartPolicy: Always
status: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ridewithvia-config # line 49
data:
  APP_ENV: prod
  APP_THREADS: "1"
  INTERVAL: "30"
  LOGLEVEL: info
  MAILER_URL: "smtp://mail-server:1025"
  MONGODB_URL: "mongodb://mongodb:27017"
  REDIS_DSN: "redis://redis:6379?timeout=0.5"
---
