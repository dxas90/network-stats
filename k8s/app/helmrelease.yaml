---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-stats
spec:
  interval: 30m
  chart:
    spec:
      chart: ./k8s/network-stats
      sourceRef:
        kind: GitRepository
        name: network-stats
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: "registry.gitlab.com/dxas90/network-stats"
    env:
      variables:
        APP_ENV: "production"
