# Template: Build, Test, Notify, and Deploy a containerized Python app
# Adapted from https://gitlab.com/dxas90/network-stats

.python-test:
  image: bash
  script:
    - echo "Testing all the code JUnit/pytest/mocha ......"

.notify:
  image: bash
  script:
    - echo "Notify all the people that need to know about this project using some tool like Slack/Mattermost/RocketChat/MSTeams..."

# Containerize the app using Buildah instead of Kaniko
.containerize:
# Build and publish a tag/branch to Gitlab Docker Registry using Buildah and Gitlab Docker executor.
# Buildah can build Docker images without using Docker-In-Docker and it's permission
# drawbacks. No additional configuration required.
  image: quay.io/buildah/stable:latest
  stage: build
  variables:
    # Buildah configuration for rootless builds
    STORAGE_DRIVER: vfs                   # Use VFS driver (no overlay)
    BUILDAH_FORMAT: docker                # Use Docker image manifest format
    BUILDAH_ISOLATION: chroot             # Use chroot for RUN commands (rootless friendly)
    
    # Additional options for Buildah build
    BUILDAH_ARGS: ""                      # Additional buildah arguments
    BUILD_CONTEXT: $CI_PROJECT_DIR        # Default build context is project directory
    
    # Registry configuration - defaults to GitLab registry
    REGISTRY: $CI_REGISTRY               # Can be overridden for external registries
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    
    # Image configuration variables
    IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE  # Default to GitLab project registry path
    
  script:
    # Handle custom Dockerfile/Containerfile path logic
    - |
      if [ -z "$DOCKERFILE_PATH" ]; then
        if [ -f "$BUILD_CONTEXT/Dockerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Dockerfile"
        elif [ -n "$CONTAINERFILE_PATH" ]; then
          DOCKERFILE_PATH="$CONTAINERFILE_PATH"
        elif [ -f "$BUILD_CONTEXT/Containerfile" ]; then
          DOCKERFILE_PATH="$BUILD_CONTEXT/Containerfile"
        else
          echo "No suitable configuration for the build context found. Please check your configuration."
          exit 1
        fi
      fi
    - echo "Using Dockerfile: $DOCKERFILE_PATH"
    
    # Determine image tag if not explicitly provided
    - |
      if [ -z ${IMAGE_TAG+x} ]; then
        if [ "$CI_COMMIT_REF_NAME" = $CI_DEFAULT_BRANCH ]; then
          VERSION="latest"
        elif [ -n "$CI_COMMIT_TAG" ]; then
          NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / - )
          SANITIZED="${NOSLASH//[^a-zA-Z0-9.-]/}"
          VERSION="$SANITIZED"
        else
          NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / - )
          SANITIZED="${NOSLASH//[^a-zA-Z0-9-]/}"
          VERSION="branch-$SANITIZED"
        fi
        export IMAGE_TAG="$IMAGE_REPOSITORY:$VERSION"
      fi
    - echo "Building image: $IMAGE_TAG"
    
    # Login to registry
    - buildah login -u "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" "$REGISTRY"
    
    # Build and push the container image
    - echo "Building container with buildah..."
    - buildah bud -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" $BUILDAH_ARGS "$BUILD_CONTEXT"
    
    # Push by default, unless NO_PUSH is defined
    - |
      if [ -z "$NO_PUSH" ]; then
        echo "Pushing image to registry..."
        buildah push "$IMAGE_TAG"
      else
        echo "Skipping push as NO_PUSH is defined"
      fi
  
  # Run this job in a branch/tag where a Containerfile/Dockerfile exists
  rules:
    - exists:
        - Containerfile
        - Dockerfile
    # Custom Containerfile/Dockerfile path
    # If both variables are set, DOCKERFILE_PATH will be used
    - if: $DOCKERFILE_PATH
    - if: $CONTAINERFILE_PATH
    # Custom build context without an explicit Dockerfile path
    - if: $BUILD_CONTEXT != $CI_PROJECT_DIR

# Deploy the tagged image using Kustomize and kubectl
# Works with GitLab-managed or self-managed clusters
.deployment:
  image: dxas90/ci-tools:v0.0.2
  script:
    # Validate the tag before deployment
    - curl -sLo /usr/local/bin/version-validator https://gist.githubusercontent.com/dxas90/809116d5d3b478665979b78c251e53c1/raw/19c07dd0d725ffdac986a5c34b8aa7215a92e082/validate-version.sh
    - chmod +x /usr/local/bin/version-validator
    - version-validator "${CI_COMMIT_TAG}"

    # Authenticate to registry and re-tag the image
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

    # Set image in Kustomize overlay and deploy to Kubernetes
    - cd k8s/overlays/prod
    - kustomize edit set image "$CI_REGISTRY_IMAGE:v$CI_COMMIT_TAG"
    - kubectl -n "$KUBE_NAMESPACE" apply -k .
    - echo "Any other custom logic that needs to be done"
    - kubectl -n "$KUBE_NAMESPACE" rollout status deployment network-stats
